name: build-and-test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run host tests
        run: tests/run_host_tests.sh

  esp32s3-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build firmware
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py build
      - name: Run host tests
        run: tests/run_host_tests.sh
      - name: Package flash and OTA images
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          python tools/package_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: esp32-s3-bacnet-firmware
          path: release/v*/
          if-no-files-found: error
